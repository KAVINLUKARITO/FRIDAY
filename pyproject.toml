[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-first-ai-worker"
version = "1.0.0"
description = "Production-grade local-first AI worker pipeline."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
]

[tool.setuptools]
py-modules = [
    "config",
    "planner",
    "validator",
    "executor",
    "verifier",
    "tools",
    "storage",
    "logger",
    "runner",
    "eval",
]
